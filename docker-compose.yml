services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cne_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cne_imbabura}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./infra/postgres/02-mcp-readonly.sql:/docker-entrypoint-initdb.d/02-mcp-readonly.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cne_imbabura}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
