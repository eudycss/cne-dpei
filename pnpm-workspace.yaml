packages:
  - "apps/*"
  - "packages/*"
shamefullyHoist: true
overrides:
  yargs: "^17.6.2"
  # Vulnerabilidades altas: ws viene de jsdom (pruebas); form-data, de jsdom y
  # también de axios (producción). Solo se reescribe el rango vulnerable.
  # Nota: xlsx (apps/web) se instala desde el tarball oficial de SheetJS porque
  # npm quedó en 0.18.5, con CVE conocidas; no volver a "xlsx": "^0.18.5".
  "ws@>=8.0.0 <8.21.0": "8.22.0"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  nestjs-pino: true
  prisma: true
