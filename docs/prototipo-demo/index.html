<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Demo sistema CNE Imbabura</title>
<style>
  :root {
    --escena: #0b1630;
    --texto: #1f2937;
    --muted: #6b7280;
    --borde: #e5e7eb;
    --fondo-web: #f5f6fa;
    --sidebar: #1e293b;
    --sidebar-link: #cbd5e1;
    --primario: #2563eb;
    --ok-bg: #d1fae5; --ok-tx: #065f46;
    --warn-bg: #fef3c7; --warn-tx: #92400e;
    --err-bg: #fee2e2; --err-tx: #991b1b;
    --tg-fondo: #0e1621; --tg-burbuja: #182533; --tg-cab: #17212b; --tg-azul: #2aabee;
    --acento: #f5b301;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--escena); overflow: hidden; }
  body { font-family: "Segoe UI", Inter, system-ui, sans-serif; color: var(--texto); }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

  /* Escenario fijo de 1600x900 que se escala a la ventana */
  #escenario { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: 0 0; }

  /* Capítulos */
  .capitulos { position: absolute; left: 24px; right: 24px; top: 14px; height: 46px; display: flex; gap: 6px; align-items: stretch; }
  .capitulos button { flex: 1; border: 0; border-radius: 12px; background: #13264d; color: #a9b6d3; font-size: 13px; font-weight: 700; padding: 4px 8px; text-align: left; line-height: 1.15; display: flex; gap: 8px; align-items: center; transition: background .2s; }
  .capitulos button b { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #1f3a63; color: #fff; display: grid; place-items: center; font-size: 12px; }
  .capitulos button.hecho b { background: #047857; }
  .capitulos button[aria-current="step"] { background: var(--acento); color: #1b1b1b; }
  .capitulos button[aria-current="step"] b { background: #1b1b1b; color: var(--acento); }
  .capitulos button:hover:not([aria-current="step"]) { background: #1a3363; color: #fff; }

  .paneles { position: absolute; left: 24px; right: 24px; top: 72px; height: 642px; display: grid; grid-template-columns: 330px 1fr 340px; gap: 22px; }
  .rotulo { color: #a9b6d3; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .rotulo .quien { color: #f4f6fb; letter-spacing: 0; text-transform: none; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .rotulo .mire { margin-left: auto; display: none; background: var(--acento); color: #1b1b1b; border-radius: 999px; padding: 2px 10px; font-size: 11px; letter-spacing: .04em; animation: latido 1.4s ease-in-out infinite; }
  .panel.foco .mire { display: inline-block; }
  @keyframes latido { 50% { transform: scale(1.08); } }
  .panel { position: relative; display: flex; flex-direction: column; min-height: 0; transition: opacity .35s, filter .35s; }
  .panel.apagado { opacity: .38; filter: grayscale(.6); }
  .marco { flex: 1; min-height: 0; border-radius: 22px; overflow: hidden; position: relative; transition: box-shadow .3s; }
  .marco.cambio { animation: brillo 1.6s ease-out; }
  @keyframes brillo { 0% { box-shadow: 0 0 0 0 rgba(245,179,1,.0); } 25% { box-shadow: 0 0 0 6px rgba(245,179,1,.9); } 100% { box-shadow: 0 0 0 0 rgba(245,179,1,0); } }

  /* Celular */
  .celular { background: #111; border: 10px solid #111; border-radius: 40px; }
  .pantalla { position: absolute; inset: 0; background: var(--fondo-web); border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; }
  .barra-estado { height: 28px; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 12px; font-weight: 600; color: #111; background: #fff; flex: none; }
  .app-cab { background: #fff; border-bottom: 1px solid var(--borde); padding: 8px 16px 10px; flex: none; }
  .app-cab h3 { font-size: 17px; }
  .app-cab small { color: var(--muted); font-size: 12px; }
  .pestanas { display: flex; background: #fff; border-bottom: 1px solid var(--borde); flex: none; }
  .pestanas span { flex: 1; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 8px 2px; border-bottom: 3px solid transparent; }
  .pestanas span.on { color: var(--primario); border-color: var(--primario); }
  .app-cuerpo { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 12px; font-size: 13.5px; line-height: 1.45; }
  .tarjeta b { font-weight: 700; }
  .et { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .btn-app { display: block; width: 100%; padding: 12px; border-radius: 12px; border: 0; background: var(--primario); color: #fff; font-weight: 700; font-size: 14.5px; text-align: center; }
  .btn-app.ok { background: #047857; }
  .btn-app.sec { background: #fff; color: var(--primario); border: 1.5px solid var(--primario); }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .chip.ok { background: var(--ok-bg); color: var(--ok-tx); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-tx); }
  .chip.err { background: var(--err-bg); color: var(--err-tx); }
  .chip.info { background: #e0e7ff; color: #3730a3; }
  .chip.gris { background: #f1f5f9; color: #475569; }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .foto-mini { height: 72px; border-radius: 10px; background: linear-gradient(135deg, #cbd5e1, #94a3b8); display: grid; place-items: center; font-size: 28px; }
  .check-li { display: flex; gap: 10px; align-items: center; padding: 5px 0; font-size: 13.5px; border-bottom: 1px solid var(--borde); }
  .check-li:last-child { border: 0; }
  .check-li i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: #059669; color: #fff; display: grid; place-items: center; font-size: 13px; flex: none; }
  .check-li i.alerta { background: #d97706; }
  .opcion { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1.5px solid var(--borde); border-radius: 10px; font-size: 13px; margin-top: 6px; }
  .opcion.sel { border-color: var(--primario); background: #eff6ff; }
  .opcion .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #9ca3af; flex: none; }
  .opcion.sel .radio { border: 5px solid var(--primario); }
  .opcion small { display: block; color: var(--muted); font-size: 11.5px; }
  .contador { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--borde); border-radius: 14px; padding: 10px 14px; }
  .contador .num { font-size: 30px; font-weight: 800; color: var(--primario); white-space: nowrap; }
  .contador .num small { font-size: 18px; color: #64748b; font-weight: 700; }
  .contador .lbl { font-size: 13px; font-weight: 600; line-height: 1.3; flex: 1; }
  .barrita { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .barrita div { height: 100%; background: #059669; border-radius: 3px; transition: width .8s; }
  .gps { display: flex; align-items: center; gap: 12px; }
  .pulso { width: 16px; height: 16px; border-radius: 50%; background: #059669; box-shadow: 0 0 0 0 rgba(5,150,105,.6); animation: pulso 1.6s infinite; flex: none; }
  @keyframes pulso { 70% { box-shadow: 0 0 0 14px rgba(5,150,105,0); } 100% { box-shadow: 0 0 0 0 rgba(5,150,105,0); } }
  .login-logo { margin: 34px auto 8px; width: 70px; height: 70px; border-radius: 20px; background: var(--primario); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 800; }
  .campo { border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 12px; background: #fff; font-size: 13.5px; color: #6b7280; }
  .campo.lleno { color: var(--texto); }
  .qr { width: 100%; height: 92px; border-radius: 12px; border: 2px dashed #93c5fd; background: #eff6ff; display: grid; place-items: center; color: #1d4ed8; font-weight: 700; font-size: 13px; text-align: center; }

  /* Navegador web */
  .navegador { background: #fff; display: flex; flex-direction: column; }
  .nav-barra { height: 36px; background: #e5e7eb; display: flex; align-items: center; gap: 8px; padding: 0 14px; flex: none; }
  .nav-barra span { width: 11px; height: 11px; border-radius: 50%; background: #f87171; }
  .nav-barra span:nth-child(2) { background: #fbbf24; } .nav-barra span:nth-child(3) { background: #34d399; }
  .nav-url { margin-left: 12px; flex: 1; background: #fff; border-radius: 8px; padding: 4px 12px; font-size: 13px; color: #4b5563; }
  .web { flex: 1; display: flex; min-height: 0; }
  .sidebar { width: 168px; background: var(--sidebar); color: var(--sidebar-link); padding: 12px 8px; font-size: 12.5px; flex: none; }
  .marca { background: #fff; color: var(--sidebar); border-radius: 10px; padding: 7px 10px; font-weight: 800; font-size: 13px; margin-bottom: 10px; }
  .menu a { display: block; padding: 6px 9px; border-radius: 8px; color: inherit; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu a.activo { background: #334155; color: #fff; font-weight: 700; box-shadow: inset 3px 0 0 var(--acento); }
  .contenido { flex: 1; background: var(--fondo-web); padding: 14px 16px; overflow: hidden; display: flex; flex-direction: column; gap: 11px; min-width: 0; position: relative; }
  .contenido h2 { font-size: 19px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .kpi { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 9px 12px; }
  .kpi small { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .kpi div { font-size: 24px; font-weight: 800; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; font-size: 12.5px; }
  th { text-align: left; background: #f9fafb; color: #374151; font-size: 11.5px; padding: 7px 9px; border-bottom: 1px solid var(--borde); }
  td { padding: 7px 9px; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
  td small { display: block; color: var(--muted); font-size: 11px; }
  tr.resalta td { background: #fffbeb; }
  tr.error td { background: #fef2f2; }
  .mono { font-family: Consolas, monospace; font-size: 11.5px; }
  .dos-col { display: grid; grid-template-columns: 2.1fr 1fr; align-items: start; gap: 12px; min-height: 0; }
  .dos-col table { font-size: 11.5px; }
  .dos-col td { padding: 6px 7px; }
  .dos-col .chip { font-size: 11px; padding: 2px 7px; }
  .mapa { background: #fff; border: 1px solid var(--borde); border-radius: 12px; position: relative; overflow: hidden; }
  .mapa svg { width: 100%; height: auto; display: block; }
  .leyenda-est { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; }
  .leyenda-est span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; background: var(--c); }
  .barra-est { display: flex; height: 24px; border-radius: 8px; overflow: hidden; }
  .barra-est div { transition: flex-grow .8s; color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; min-width: 0; }
  .filtros { display: flex; gap: 10px; align-items: center; font-size: 12.5px; flex-wrap: wrap; }
  .select { background: #fff; border: 1px solid #d1d5db; border-radius: 8px; padding: 5px 10px; font-size: 12.5px; min-width: 150px; display: inline-flex; justify-content: space-between; gap: 10px; }
  .select::after { content: "▾"; color: var(--muted); }
  .select.on { border-color: var(--acento); box-shadow: 0 0 0 3px rgba(245,179,1,.35); font-weight: 700; }
  .boton { display: inline-block; background: var(--primario); color: #fff; border-radius: 8px; padding: 5px 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .boton.sec { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  .boton.on { box-shadow: 0 0 0 3px rgba(245,179,1,.7); }
  .alerta-w { border-left: 5px solid #dc2626; }
  .nota { font-size: 12.5px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a; border-radius: 10px; padding: 8px 11px; line-height: 1.4; }
  .nota.ok { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
  .nota.err { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

  /* Modal dentro del panel web */
  .velo { position: absolute; inset: 0; background: rgba(15,23,42,.45); display: grid; place-items: center; animation: aparece .35s ease-out; }
  .modal { background: #fff; border-radius: 14px; width: 380px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 20px 50px rgba(0,0,0,.3); font-size: 13px; }
  .modal h4 { font-size: 16px; }
  .modal label { font-size: 11.5px; font-weight: 700; color: #374151; }
  .modal .campo { padding: 7px 10px; font-size: 13px; color: var(--texto); }
  .modal .campo.corregido { border-color: #059669; background: #f0fdf4; }
  .lista-drop { border: 1px solid #d1d5db; border-radius: 8px; margin-top: -4px; font-size: 12.5px; overflow: hidden; }
  .lista-drop div { padding: 5px 10px; border-bottom: 1px solid #f3f4f6; }
  .lista-drop div.sel { background: #eff6ff; font-weight: 700; }
  @keyframes aparece { from { opacity: 0; } to { opacity: 1; } }

  /* Antes / ahora */
  .hojas { display: flex; gap: 14px; justify-content: center; }
  .hoja { width: 150px; height: 180px; background: #fff; border: 1px solid #d1d5db; border-radius: 6px; box-shadow: 4px 4px 0 #e5e7eb, 8px 8px 0 #f1f5f9; padding: 12px; font-size: 11px; position: relative; display: flex; flex-direction: column; gap: 6px; }
  .hoja b { font-size: 12px; }
  .hoja .lin { height: 6px; border-radius: 3px; background: #e5e7eb; }
  .hoja .firma { margin-top: auto; border-top: 1px solid #9ca3af; padding-top: 3px; color: #6b7280; font-style: italic; }
  .tira-hojas { display: flex; gap: 8px; align-items: center; font-size: 12.5px; background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 8px 12px; }
  .tira-hojas .h { width: 26px; height: 32px; border: 1px solid #cbd5e1; border-radius: 3px; background: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #475569; position: relative; flex: none; }
  .tira-hojas .h.x { background: #fef2f2; border-color: #fca5a5; color: transparent; }
  .tira-hojas .h.x::after { content: "✕"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; color: #dc2626; }
  .piezas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pieza { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; line-height: 1.4; }
  .pieza .ico { font-size: 24px; }
  .glosario { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .glosario div { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 9px 12px; font-size: 12.5px; line-height: 1.4; }
  .glosario b { display: block; font-size: 14px; color: #1e3a8a; }

  /* Acta PDF */
  .acta { background: #fff; border: 1px solid #d1d5db; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 14px 18px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
  .acta h5 { font-size: 13px; text-align: center; letter-spacing: .04em; line-height: 1.4; }
  .acta .sec { border: 1px solid #e5e7eb; border-radius: 6px; padding: 7px 9px; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; }
  .acta .sec i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: #059669; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 800; }

  /* Telegram */
  .telegram { background: var(--tg-fondo); display: flex; flex-direction: column; color: #e6edf3; }
  .tg-cab { background: var(--tg-cab); padding: 11px 14px; display: flex; gap: 10px; align-items: center; flex: none; }
  .tg-av { width: 38px; height: 38px; border-radius: 50%; background: var(--tg-azul); display: grid; place-items: center; font-size: 20px; }
  .tg-cab b { font-size: 15px; display: block; } .tg-cab small { font-size: 12px; color: #7f91a4; }
  .tg-msgs { flex: 1; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 9px; overflow: hidden; }
  .tg-b { background: var(--tg-burbuja); border-radius: 14px 14px 14px 4px; padding: 9px 12px; font-size: 13px; line-height: 1.42; animation: entra .45s ease-out; max-width: 96%; flex: none; }
  .tg-b.yo { align-self: flex-end; background: #2b5278; border-radius: 14px 14px 4px 14px; }
  .tg-b .h { display: block; text-align: right; font-size: 11px; color: #7f91a4; margin-top: 2px; }
  .tg-b .quien { display: block; font-size: 12px; font-weight: 700; color: #6ab3f3; margin-bottom: 2px; }
  .tg-inline { display: flex; gap: 4px; margin-top: 6px; }
  .tg-inline span { flex: 1; background: #2b3a4a; border-radius: 6px; padding: 4px; text-align: center; font-size: 12px; }
  .tg-inline span.on { background: #1b6fa3; color: #fff; }
  .tg-teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 7px; background: var(--tg-cab); flex: none; }
  .tg-teclado div { background: #2b3a4a; border-radius: 8px; padding: 7px 4px; text-align: center; font-size: 12px; transition: background .3s; }
  .tg-teclado div.on { background: #1b6fa3; color: #fff; font-weight: 700; box-shadow: 0 0 0 2px var(--acento); }
  .tg-vacio { color: #7f91a4; font-size: 13px; text-align: center; margin: auto 0; line-height: 1.5; padding: 0 10px; }
  @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Barra de control */
  .control { position: absolute; left: 24px; right: 24px; top: 728px; height: 152px; background: #10224a; border-radius: 20px; padding: 16px 22px; display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: center; color: #f4f6fb; }
  .control .paso-n { color: var(--acento); font-weight: 800; font-size: 13.5px; letter-spacing: .1em; text-transform: uppercase; }
  .control h1 { font-size: 25px; margin: 4px 0 6px; }
  .control p { font-size: 16.5px; color: #c9d4ea; line-height: 1.4; max-width: 1180px; }
  .botones { display: flex; gap: 10px; align-items: center; }
  .botones button { border: 0; border-radius: 12px; padding: 14px 20px; font-weight: 800; font-size: 16px; background: #1f3a63; color: #fff; }
  .botones button.sig { background: var(--acento); color: #1b1b1b; }
  .botones button[aria-disabled="true"] { opacity: .35; cursor: default; }
  .puntos { display: flex; gap: 5px; margin-top: 8px; }
  .puntos span { width: 22px; height: 5px; border-radius: 3px; background: #1f3a63; }
  .puntos span.on { background: var(--acento); }
  .progreso { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--acento); border-radius: 0 0 0 20px; transition: width .4s; }
  .ayuda { position: absolute; right: 30px; top: 884px; color: #8a99bb; font-size: 12px; }
  body.sin-guia .control p { display: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="escenario">
  <nav class="capitulos" id="capitulos" aria-label="Capítulos de la demo"></nav>

  <div class="paneles">
    <section class="panel" id="p-movil" aria-label="App móvil">
      <div class="rotulo">📱 App móvil <span class="quien" id="rol-movil"></span><span class="mire">👀 Mire aquí</span></div>
      <div class="marco celular" id="m-movil"><div class="pantalla" id="movil"></div></div>
    </section>
    <section class="panel" id="p-web" aria-label="Panel web">
      <div class="rotulo">💻 Panel web <span class="quien" id="rol-web"></span><span class="mire">👀 Mire aquí</span></div>
      <div class="marco navegador" id="m-web">
        <div class="nav-barra"><span></span><span></span><span></span><div class="nav-url" id="url"></div></div>
        <div class="web">
          <nav class="sidebar" aria-label="Menú">
            <div class="marca">CNE · Imbabura</div>
            <div class="menu" id="menu"></div>
          </nav>
          <main class="contenido" id="web"></main>
        </div>
      </div>
    </section>
    <section class="panel" id="p-tg" aria-label="Telegram">
      <div class="rotulo">✈️ Telegram <span class="quien">· grupo de técnicos</span><span class="mire">👀 Mire aquí</span></div>
      <div class="marco telegram" id="m-tg">
        <div class="tg-cab"><div class="tg-av">🤖</div><div><b>Bot Enlaces CNE</b><small>bot · grupo de técnicos</small></div></div>
        <div class="tg-msgs" id="tg" aria-live="polite"></div>
        <div class="tg-teclado" id="tg-teclado"></div>
      </div>
    </section>
  </div>

<script>
/* ---------- Datos de ejemplo (ficticios) ---------- */
const KIT = { codigo: '1221', recinto: 'UE Otavalo', canton: 'Otavalo', operador: 'Ana Torres', asistente: 'Luis Andrade', militar: 'Sgto. Pablo Ruiz', tecnico: 'Jorge Vaca' };
const TOTAL = 55;
const MENU = ['Usuarios', 'Militares', 'Recintos Electorales', 'Eventos Electorales', 'Asignaciones', 'Kits Electorales', 'Monitoreo', 'Incidencias', 'Alertas', 'Enlaces', 'Cadena de custodia', 'Reportes', 'Power BI CDAS'];
const ESTADOS = [
  ['dpi', 'En DPEI', '#9ca3af'], ['transito', 'En tránsito', '#7c3aed'],
  ['recinto', 'En el recinto', '#f59e0b'], ['retorno', 'En retorno', '#2563eb'], ['llego', 'Llegó al DPEI', '#16a34a'],
];
const COLOR = Object.fromEntries(ESTADOS.map(([k, , c]) => [k, c]));
const chipEstado = {
  dpi: '<span class="chip gris">En DPEI</span>',
  transito: '<span class="chip" style="background:#ede9fe;color:#5b21b6">En tránsito</span>',
  recinto: '<span class="chip warn">En el recinto</span>',
  retorno: '<span class="chip info">En retorno</span>',
  llego: '<span class="chip ok">Llegó al DPEI</span>',
};

/* 55 CDA con posiciones fijas (sin aleatorios); cada uno pertenece al cantón más cercano. */
const PUNTOS = Array.from({ length: TOTAL }, (_, i) => {
  const a = i * 2.39996, r = 30 + 150 * Math.sqrt((i + 0.5) / TOTAL);
  return [300 + r * Math.cos(a) * 1.15, 200 + r * Math.sin(a) * 0.85];
});
const CANTONES = { Ibarra: [440, 165], Otavalo: [200, 280], Cotacachi: [140, 140], 'Antonio Ante': [300, 215], Pimampiro: [500, 290], 'Urcuquí': [320, 80] };
const distancia = ([x1, y1], [x2, y2]) => Math.hypot(x1 - x2, y1 - y2);
const CANTON_DE = PUNTOS.map((pt) => Object.keys(CANTONES).reduce((a, b) => (distancia(CANTONES[a], pt) <= distancia(CANTONES[b], pt) ? a : b)));
const DPI = [450, 190], OTAVALO = [200, 285];

/* Reparte los estados entre los puntos (en orden fijo) y devuelve el estado de cada punto. */
function estadosDePuntos(c) {
  const lista = [];
  ['llego', 'retorno', 'recinto', 'transito', 'dpi'].forEach((k) => { for (let i = 0; i < (c[k] || 0); i++) lista.push(k); });
  return PUNTOS.map((_, i) => lista[i] || 'dpi');
}
function contar(c, canton) {
  if (!canton) return c;
  const out = {};
  estadosDePuntos(c).forEach((e, i) => { if (CANTON_DE[i] === canton) out[e] = (out[e] || 0) + 1; });
  return out;
}

/* ---------- Piezas reutilizables ---------- */
const hora = (h) => `<div class="barra-estado"><span>${h}</span><span>📶 🔋</span></div>`;
const cab = (t, s, h) => `${hora(h)}<div class="app-cab"><h3>${t}</h3>${s ? `<small>${s}</small>` : ''}</div>`;
const pestanas = (lista, on) => `<div class="pestanas">${lista.map((p, i) => `<span class="${i === on ? 'on' : ''}">${p}</span>`).join('')}</div>`;
const PEST_AET = ['Entregar a militar', 'Verificar retorno', 'Verificados'];
const PEST_SUP = ['Monitoreo', 'Alertas', 'Recintos difíciles'];
const asignacion = `<div class="tarjeta"><div class="et">Mi asignación</div><b>Kit ${KIT.codigo}</b> · ${KIT.recinto}<br><span style="color:var(--muted)">Cantón ${KIT.canton} · Técnico: ${KIT.tecnico}</span></div>`;
const contadorAet = (n, txt = 'kits entregados a militares') => `<div class="contador" role="status" aria-label="${n} de ${TOTAL} ${txt}"><div class="num">${n}<small> / ${TOTAL}</small></div><div class="lbl">${txt}<div class="barrita"><div style="width:${(n / TOTAL) * 100}%"></div></div></div></div>`;
/* marcas: 1 = completo, 2 = con novedad */
const contenido = (marcas = [1, 1, 1]) => ['Laptop', 'Escáner', 'Impresora'].map((n, i) => `<div class="check-li"><i class="${marcas[i] === 2 ? 'alerta' : ''}">${marcas[i] === 2 ? '!' : '✓'}</i>${n}${marcas[i] === 2 ? ' · con novedad' : ''}</div>`).join('');
const militar = (ap, nom, grado, ci, rec, sel) => `<div class="opcion ${sel ? 'sel' : ''}"><span class="radio"></span><div><b>${ap} ${nom}</b> · ${grado}<small>C.I. ${ci} · ${rec}</small></div></div>`;

/* ---------- Pantallas del celular ---------- */
const MOVIL = {
  portada: () => `${hora('07:00')}<div class="app-cuerpo" style="justify-content:center;text-align:center;gap:14px">
      <div class="login-logo" style="margin:0 auto">CNE</div><h3>Logística electoral</h3>

      <span class="chip info" style="align-self:center">Funciona aunque no haya señal</span></div>`,
  login: () => `${hora('07:30')}<div class="app-cuerpo" style="justify-content:flex-start">

      <div class="campo">Cédula</div><div class="campo">Contraseña</div><div class="btn-app">Ingresar</div>

  cambioPwd: () => `${cab('Cambiar contraseña', 'Primer ingreso', '07:31')}<div class="app-cuerpo">

      <div class="btn-app">Guardar y continuar</div></div>`,

      ${militar('Ruiz', 'Pablo', 'Sgto.', '1700000009', KIT.recinto, true)}${militar('Cevallos', 'Marco', 'Cbo.', '1700000002', KIT.recinto, false)}</div>
      <div class="nota ok">✓ Aquí aparecen <b>los militares cargados en la web</b> para ese recinto. Si se corrige el recinto en la web, la app ya lo muestra bien.</div></div>`,
  cdaAsignado: () => `${cab('Registro de salida', 'Hola, ' + KIT.operador, '06:40')}<div class="app-cuerpo">${asignacion}

  aetInicio: () => `${cab('Entregar kit a militar', 'Asistente transversal · ' + KIT.asistente, '05:58')}${pestanas(PEST_AET, 0)}<div class="app-cuerpo">
      ${contadorAet(0)}
      <div class="qr">📷 Escanear el QR del kit<br><span style="font-weight:500;color:#475569">o escribir el código</span></div>
      <div class="nota">El asistente usa la app en el <b>DPEI</b>: entrega los kits a los militares en la mañana y los recibe de vuelta del operador CDA en la noche.</div></div>`,
  aetEntrega: () => `${cab('Entregar kit a militar', 'Asistente transversal', '06:05')}${pestanas(PEST_AET, 0)}<div class="app-cuerpo">
      ${contadorAet(1)}
      <div class="tarjeta"><div class="fila"><b style="font-size:17px;color:var(--primario)">${KIT.codigo}</b><span class="chip info">QR leído</span></div>
      <div class="et" style="margin-top:6px">Operador CDA</div>${KIT.operador} <span style="color:var(--primario);font-size:12px;text-decoration:underline">Cambiar operador</span>
      <div class="et" style="margin-top:6px">Militar que lo lleva al recinto</div>
      ${militar('Ruiz', 'Pablo', 'Sgto.', '1700000009', KIT.recinto, true)}</div>
      <div class="btn-app ok">✓ Entrega registrada · 06:05</div></div>`,
  aetCorregir: () => `${cab('Entregar kit a militar', 'Asistente transversal', '07:20')}${pestanas(PEST_AET, 0)}<div class="app-cuerpo">
      ${contadorAet(38)}
      <div class="tarjeta"><b style="color:var(--primario)">Kit 1310</b> · UE Pimampiro<div class="et" style="margin-top:6px">Cambiar militar</div>
      ${militar('Mora', 'Diego', 'Sgto.', '1700000077', 'UE Pimampiro', true)}
      <div class="et" style="margin-top:8px">Motivo del cambio (obligatorio)</div><div class="campo lleno" style="font-size:12.5px">El militar asignado fue reemplazado</div></div>
      <div class="btn-app">Guardar cambio de militar</div></div>`,
  salida: () => `${cab('Registro de salida', KIT.operador, '06:45')}<div class="app-cuerpo">${asignacion}
      <div class="tarjeta" style="border-color:#6ee7b7"><span class="chip ok">✓ Salida del DPEI registrada</span><p style="margin-top:8px">🕖 <b>06:45</b><br>📍 Ubicación GPS guardada<br><span style="color:var(--muted);font-size:12px">Si no hay señal, se guarda y se envía al recuperarla.</span></p></div>
      <div class="btn-app sec">Continuar</div></div>`,
  transito: () => `${cab('En tránsito', 'Rumbo a ' + KIT.recinto, '07:05')}<div class="app-cuerpo">

      <div class="tarjeta"><div class="et">Distancia al recinto</div><div style="font-size:30px;font-weight:800">8,4 km</div></div>
      <div class="nota">🔔 A <b>200 m</b> del recinto el celular suena y vibra para que no se pase.</div>${asignacion}</div>`,
  llegada: () => `${cab('Llegada al recinto', KIT.recinto, '07:30')}<div class="app-cuerpo">
      <div class="tarjeta" style="border-color:#6ee7b7"><span class="chip ok">📍 Está dentro del recinto</span><p style="margin-top:8px">A <b>35 m</b> del punto del recinto</p></div>

      <div class="nota err">Si estuviera lejos, la app <b>no deja</b> registrar la llegada: así nadie marca "llegué" desde otro lugar.</div>${asignacion}</div>`,
  recepcion: () => `${cab('Llegada al recinto', 'Paso 1 · Recibir el kit del militar', '07:35')}<div class="app-cuerpo">
      <div class="tarjeta"><div class="et">Entrega</div>${KIT.militar}<div class="et" style="margin-top:6px">Recibe</div>${KIT.operador}</div>
      <div class="tarjeta"><div class="et">Foto con el militar y el kit</div><div class="foto-mini">📷 🪖 📦</div></div>
      <div class="tarjeta"><div class="et">Contenido</div>${contenido()}</div>
      <div class="btn-app ok">✓ Kit recibido · 07:35</div></div>`,
  actas: () => `${cab('Salida del recinto', 'Paso 2 · Actas obligatorias', '19:40')}<div class="app-cuerpo">
      <div class="tarjeta"><div class="et">Acta de instalación</div><div class="foto-mini">📄</div><span class="chip ok" style="margin-top:6px">✓ Foto enviada · 08:10</span></div>
      <div class="tarjeta"><div class="et">Acta de escrutinio</div><div class="foto-mini">📄</div><span class="chip ok" style="margin-top:6px">✓ Foto enviada · 19:35</span></div>
      <div class="btn-app">Registrar salida del recinto</div></div>`,
  retorno: () => `${cab('En retorno', 'Rumbo al DPEI', '20:05')}<div class="app-cuerpo">
      <div class="tarjeta gps"><div class="pulso"></div><div><b>Rastreo activo</b><br><span style="color:var(--muted);font-size:12.5px">Salió del recinto a las 19:45</span></div></div>
      <div class="tarjeta"><div class="et">Distancia al DPEI</div><div style="font-size:30px;font-weight:800">3,1 km</div></div>
      <div class="tarjeta"><span class="chip ok">📍 Llegada al DPEI · 20:40</span><p style="margin-top:6px;font-size:12.5px;color:var(--muted)">También comprueba que está dentro del DPEI.</p></div>
      <div class="btn-app sec">Entregar el kit al asistente</div></div>`,
  aetVerificar: () => `${cab('Verificar retorno', 'Asistente transversal', '20:50')}${pestanas(PEST_AET, 1)}<div class="app-cuerpo">
      <div class="tarjeta"><div class="fila"><b style="color:var(--primario);font-size:16px">${KIT.codigo}</b><span class="chip info">QR leído</span></div><div style="font-size:12.5px;color:var(--muted)">Devuelve: ${KIT.operador}</div>
      <div class="et" style="margin-top:6px">¿Volvió completo?</div>${contenido([1, 1, 2])}
      <div class="et" style="margin-top:6px">Observaciones</div><div class="campo lleno" style="font-size:12.5px">Impresora sin cable de poder</div></div>
      <div class="btn-app ok">✓ Retorno confirmado · 20:50</div>
      <p style="text-align:center;font-size:12.5px;font-weight:700">12 kits verificados en esta sesión</p></div>`,
  aetVerificados: () => `${cab('Kits verificados', 'Asistente transversal', '21:30')}${pestanas(PEST_AET, 2)}<div class="app-cuerpo">
      ${contadorAet(39, 'kits recibidos de vuelta y verificados')}
      <div class="tarjeta" style="padding:6px 12px">
      ${[[KIT.codigo, KIT.recinto, '20:50', 'con novedad'], ['1286', 'UE 17 de Julio', '20:44', ''], ['989', 'UE L. U. de la Torre', '20:31', ''], ['2066', 'UE Florencio Leary', '20:12', '']].map(([c, r, h, n]) => `<div class="check-li"><i class="${n ? 'alerta' : ''}">${n ? '!' : '✓'}</i><div style="flex:1"><b>${c}</b> ${r}<br><span style="font-size:11.5px;color:var(--muted)">${h} · ${n || 'completo'}</span></div></div>`).join('')}</div>
      <div class="nota">Total del evento: entregados al militar <b>55</b> · de vuelta <b>39</b>.</div></div>`,
  supMonitoreo: () => `${cab('Monitoreo de operadores', 'Técnico supervisor', '07:10')}${pestanas(PEST_SUP, 0)}
      <svg viewBox="0 0 300 170" style="display:block;background:#e8eef5;flex:none" role="img" aria-label="Mapa de operadores en ruta">
        <path d="M30 60 C60 15 160 8 220 22 C270 35 290 80 275 120 C262 155 200 168 140 162 C80 158 35 135 25 100Z" fill="#dbe4ef" stroke="#b6c3d6"/>
        ${PUNTOS.filter((_, i) => i % 3 === 0).map(([x, y], i) => `<circle cx="${x / 2.1}" cy="${y / 2.4}" r="6" fill="#7c3aed" stroke="#fff" stroke-width="2"/>`).join('')}
      </svg>
      <div class="app-cuerpo" style="gap:0;padding-top:8px"><b style="font-size:14px">En ruta (22)</b>
      ${[['Ana Torres', 'En tránsito · 1 kit · 07:09', '#7c3aed'], ['Jorge Vaca', 'En tránsito · 2 kits · 07:08', '#7c3aed'], ['María Pérez', 'En tránsito · 1 kit · 07:09', '#7c3aed'], ['Diego M.', 'En tránsito · 1 kit · 07:07', '#7c3aed']].map(([n, m, c]) => `<div class="check-li" style="justify-content:space-between"><div><b>${n}</b><br><span style="font-size:12px;color:var(--muted)"><span style="color:${c}">●</span> ${m}</span></div><span style="color:var(--primario);font-size:12px;font-weight:700">Ver ubicación</span></div>`).join('')}</div>`,
  supAlertas: () => `${cab('Alertas', 'Técnico supervisor', '09:31')}${pestanas(PEST_SUP, 1)}<div class="app-cuerpo">
      <div class="tarjeta" style="border-left:5px solid #dc2626"><span class="chip err">No llegó al recinto</span><p style="margin-top:8px"><b>Kit 1310</b> · UE Pimampiro<br><span style="color:var(--muted);font-size:12.5px">Salió 07:20 · sin llegada a las 09:30</span></p></div>
      <div class="tarjeta" style="border-left:5px solid #d97706"><span class="chip warn">Sin sincronizar</span><p style="margin-top:6px"><b>Kit 1452</b> · 25 min sin enviar ubicación</p></div>
      <div class="nota">Llega como <b>notificación</b> al celular del supervisor, aunque tenga la app cerrada.</div></div>`,
  fin: () => `${cab('Retornado', KIT.operador, '21:00')}<div class="app-cuerpo" style="justify-content:center;text-align:center">
      <div style="font-size:64px">✅</div><h3>¡Ciclo completo!</h3><p style="color:var(--muted);font-size:14px">El kit ${KIT.codigo} está de vuelta en la Delegación.<br>Gracias por su trabajo.</p></div>`,
};

/* ---------- Vistas web ---------- */
const kpi = (t, v, c = '') => `<div class="kpi"><small>${t}</small><div style="color:${c}">${v}</div></div>`;
const modal = (html) => `<div class="velo"><div class="modal" role="dialog" aria-label="Ventana de ejemplo">${html}</div></div>`;
const acciones = (ok) => `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:4px"><span class="boton sec">Cancelar</span><span class="boton on">${ok}</span></div>`;
const carga = (archivo) => `<div style="display:flex;gap:8px;align-items:center"><span class="boton sec">Descargar plantilla</span><span class="campo lleno" style="flex:1;padding:5px 10px">📄 ${archivo}</span><span class="boton on">Cargar</span></div>`;
function barraEstados(c) {
  return `<div class="barra-est">${ESTADOS.map(([k, , col]) => `<div style="flex-grow:${c[k] || 0.0001};background:${col}">${c[k] ? c[k] : ''}</div>`).join('')}</div>
    <div class="leyenda-est">${ESTADOS.map(([k, n, col]) => `<span style="--c:${col}">${n} (${c[k] || 0})</span>`).join('')}</div>`;
}
function mapa(c, { kit = null, extra = '', canton = '' } = {}) {
  const est = estadosDePuntos(c);
  const puntos = PUNTOS.map(([x, y], i) => {
    const fuera = canton && CANTON_DE[i] !== canton;
    return `<circle cx="${x}" cy="${y}" r="9" fill="${COLOR[est[i]]}" stroke="#fff" stroke-width="2" opacity="${fuera ? 0.1 : 1}"/>`;
  }).join('');
  // Etiquetas con contorno blanco para que se lean sobre los puntos.
  const etiquetas = Object.entries(CANTONES).map(([n, [x, y]]) => `<text x="${x}" y="${y - 24}" text-anchor="middle" font-size="19" font-weight="${n === canton ? 800 : 700}" fill="${n === canton ? '#0f172a' : '#475569'}" stroke="#eef2f7" stroke-width="4" paint-order="stroke">${n}</text>`).join('');
  const kitSvg = kit ? `<g><circle cx="${kit[0]}" cy="${kit[1]}" r="22" fill="#f5b301" stroke="#fff" stroke-width="3"/><text x="${kit[0]}" y="${kit[1] + 7}" text-anchor="middle" font-size="20">📦</text>
    <text x="${kit[0]}" y="${kit[1] + 44}" text-anchor="middle" font-size="18" font-weight="800" fill="#1e293b" stroke="#fff" stroke-width="4" paint-order="stroke">Kit ${KIT.codigo}</text></g>` : '';
  return `<div class="mapa"><svg viewBox="45 20 540 360" role="img" aria-label="Mapa de Imbabura con los CDA${canton ? ' del cantón ' + canton : ''}">
    <rect width="620" height="400" fill="#eef2f7"/>
    <path d="M70 120 C120 40 300 20 420 50 C520 75 590 150 560 240 C540 320 440 380 300 370 C180 362 90 320 60 240 C45 190 50 150 70 120Z" fill="#dbe4ef" stroke="#b6c3d6" stroke-width="2"/>
    ${canton ? `<circle cx="${CANTONES[canton][0]}" cy="${CANTONES[canton][1]}" r="95" fill="rgba(245,179,1,.12)" stroke="#f5b301" stroke-width="2" stroke-dasharray="6 5"/>` : ''}
    ${kit ? `<path d="M${DPI[0]} ${DPI[1]} Q 330 200 ${OTAVALO[0]} ${OTAVALO[1]}" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>` : ''}
    ${etiquetas}${puntos}
    <rect x="${DPI[0] - 12}" y="${DPI[1] - 12}" width="24" height="24" rx="5" fill="#1e293b"/><text x="${DPI[0] + 17}" y="${DPI[1] + 7}" font-size="18" font-weight="800" fill="#1e293b" stroke="#fff" stroke-width="4" paint-order="stroke">DPEI</text>
    ${extra}${kitSvg}
  </svg></div>`;
}
const FILAS_MON = [
  ['1286', 'UE 17 de Julio', 'Ibarra', 'Jorge V.'], ['989', 'UE L. U. de la Torre', 'Otavalo', 'María P.'],
  ['1126', 'UE César Borja', 'Ibarra', 'Diego M.'], ['2066', 'UE Florencio Leary', 'Otavalo', 'Paola S.'],

/* ---------- Motor ---------- */
const $ = (id) => document.getElementById(id);
const PANELES = ['movil', 'web', 'tg'];
let paso = 0;
let anterior = null;
function tgDe(i) { while (i > 0 && !PASOS[i].tg) i--; return PASOS[i].tg || []; }
const htmlWeb = (p) => (typeof p.web === 'function' ? p.web() : WEB[p.web]());

$('capitulos').innerHTML = CAPS.map((c, i) => `<button data-cap="${i}"><b>${i + 1}</b><span>${c}</span></button>`).join('');
$('capitulos').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) irA(PASOS.findIndex((p) => p.cap === Number(b.dataset.cap)));
});

function render(dir = 1) {
  const p = PASOS[paso];
  const delCap = PASOS.map((x, i) => (x.cap === p.cap ? i : -1)).filter((i) => i >= 0);
  $('paso-n').textContent = `Capítulo ${p.cap + 1} · ${CAPS[p.cap]} · paso ${delCap.indexOf(paso) + 1} de ${delCap.length} · (${paso + 1} de ${PASOS.length})`;
  $('paso-t').textContent = p.t;
  $('paso-d').textContent = p.d;
  $('puntos').innerHTML = delCap.map((i) => `<span class="${i <= paso ? 'on' : ''}"></span>`).join('');
  document.querySelectorAll('#capitulos button').forEach((b) => {
    const c = Number(b.dataset.cap);
    if (c === p.cap) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    b.classList.toggle('hecho', c < p.cap);
  });

  const msgs = tgDe(paso).map((k) => TG[k]);
  const nuevo = {
    movil: MOVIL[p.movil](),
    web: htmlWeb(p),
    tg: msgs.length ? msgs.join('') : '<div class="tg-vacio">Antes: para saber si un recinto tenía internet había que llamar al encargado.<br><br>Aquí aparecerán los avisos del bot.</div>',
  };
  $('rol-movil').textContent = p.rolM;
  $('rol-web').textContent = p.rolW;
  // Solo se reescribe lo que cambió: evita que el lector de pantalla relea el chat
  // y que se repitan las animaciones de entrada.
  PANELES.forEach((k) => { if (!anterior || anterior[k] !== nuevo[k]) $(k).innerHTML = nuevo[k]; });
  $('url').textContent = p.url;
  $('menu').innerHTML = MENU.map((m) => `<a class="${m === p.menu ? 'activo' : ''}">${m}</a>`).join('');
  $('tg-teclado').innerHTML = TECLADO.map((t, i) => `<div class="${(p.teclado || []).includes(i) ? 'on' : ''}">${t}</div>`).join('');

  // Atenúa lo que no importa en este paso y resalta los paneles que cambiaron.
  const foco = p.foco || PANELES;
  PANELES.forEach((k) => {
    const enFoco = foco.includes(k);
    $('p-' + k).classList.toggle('foco', enFoco && foco.length < PANELES.length);
    $('p-' + k).classList.toggle('apagado', !enFoco);
    const m = $('m-' + k); m.classList.remove('cambio');
    if (dir !== 0 && enFoco && anterior && anterior[k] !== nuevo[k]) { void m.offsetWidth; m.classList.add('cambio'); }
  });
  anterior = nuevo;

  // aria-disabled en vez de disabled: el botón conserva el foco del teclado en los extremos.
  const ultimo = paso === PASOS.length - 1;
  $('ant').setAttribute('aria-disabled', String(paso === 0));
  $('sig').setAttribute('aria-disabled', String(ultimo));
  $('sig').textContent = ultimo ? 'Fin ✓' : 'Siguiente ▶';
  $('sig').setAttribute('aria-label', ultimo ? 'Fin de la demo' : 'Paso siguiente');
  $('barra').style.width = ((paso + 1) / PASOS.length) * 100 + '%';
  try { localStorage.setItem('demo-paso-v2', paso); } catch {}
  try { history.replaceState(null, '', '#' + (paso + 1)); } catch {}
}
function irA(n) {
  n = Math.min(PASOS.length - 1, Math.max(0, n));
  if (n !== paso) { const d = n - paso; paso = n; render(d); }
}
const ir = (d) => irA(paso + d);
$('sig').onclick = () => ir(1);
$('ant').onclick = () => ir(-1);
$('pc').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}));
document.addEventListener('keydown', (e) => {
  // Ctrl/Alt/Cmd + tecla son atajos del navegador (buscar, atrás, pestañas).
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // Espacio/Enter sobre un botón lo activa; no debe además avanzar de paso.
  if (e.target.tagName === 'BUTTON' && [' ', 'Enter'].includes(e.key)) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); ir(1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); ir(-1); }
  else if (e.key === 'Home') irA(0);
  else if (e.key === 'End') irA(PASOS.length - 1);
  else if (/^[1-8]$/.test(e.key)) irA(PASOS.findIndex((p) => p.cap === Number(e.key) - 1));
  else if (e.key.toLowerCase() === 'f') $('pc').click();
  else if (e.key.toLowerCase() === 'g') document.body.classList.toggle('sin-guia');
});
function escalar() {
  const s = Math.min(innerWidth / 1600, innerHeight / 900);
  $('escenario').style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener('resize', escalar);
escalar();
// "#5" en la URL abre directamente ese paso; si no, se retoma donde se quedó.
const enUrl = parseInt(location.hash.slice(1), 10) - 1;
if (enUrl >= 0 && enUrl < PASOS.length) paso = enUrl;
else try { const g = parseInt(localStorage.getItem('demo-paso-v2'), 10); if (g >= 0 && g < PASOS.length) paso = g; } catch {}
render(0);
</script>
</body>
